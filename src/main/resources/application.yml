spring:
 application:
  name: taskapi
 datasource:
  url: ${DB_URL:jdbc:postgresql://localhost:5432/taskdb}
  username: ${DB_USER:taskapp}
  password: ${DB_PASSWORD:local-dev-password}
 jpa:
  open-in-view: false
  hibernate:
   ddl-auto: validate
  properties:
   hibernate:
    jdbc:
     time_zone: UTC

 liquibase:
  change-log: classpath:db/changelog/db.changelog-master.yaml
  
 mvc:
  problemdetails:
   enabled: true
 
 server:
  error:
   include-message: never
   include-stacktrace: never
   
 app:
  jwt:
   secret: ${JWT_SECRET}
   issuer: task-api
   audience: task-api-clients
   
